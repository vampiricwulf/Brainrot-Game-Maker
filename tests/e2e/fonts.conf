<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The e2e tests' fonts: the machine's own (/etc/fonts/fonts.conf) minus Inter, so system-ui falls back to what CI has
  (DejaVu Sans on Ubuntu). Some layout checks measure rows and buttons, and Inter's wider metrics move them.
  launchChromium() in helpers.mjs points Chromium here unless FONTCONFIG_FILE is already set.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont><pattern><patelt name="family"><string>Inter</string></patelt></pattern></rejectfont></selectfont>
  <selectfont><rejectfont><pattern><patelt name="family"><string>Inter Display</string></patelt></pattern></rejectfont></selectfont>
</fontconfig>
