[package]
name = "jeopardy-builder"
version = "0.1.0"
description = "Jeopardy Builder desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native downloads of online media links (no CORS limits). "unsafe-headers" lets a download leave out
# the Origin header the plugin would otherwise add, so it looks like a normal browser download.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
# Used by tauri::generate_context!() to embed the plugins section of tauri.conf.json.
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
