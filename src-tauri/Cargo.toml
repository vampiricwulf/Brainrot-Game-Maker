[package]
name = "brainrot-game-maker"
version = "1.0.0"
description = "Brainrot Games Maker desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
# A second launch focuses the running app instead of starting a copy that shares its WebView2 processes.
tauri-plugin-single-instance = "2"
# Native downloads of online media links (no CORS limits). "unsafe-headers" lets a download leave out
# the Origin header the plugin would otherwise add, so it looks like a normal browser download.
# Keep the same major.minor as @tauri-apps/plugin-http in package.json: `tauri build` refuses mismatches.
tauri-plugin-http = { version = "~2.7", features = ["unsafe-headers"] }
# The desktop app's in-place updates: a new version's signature is checked (minisign, as `tauri signer` makes it).
minisign-verify = "0.2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Detects running as administrator (which makes Discord/OBS miss the game's sound), and shows a message
# box when the window can't start at all.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# Notices WebView2's browser process crashing with the Discord audio fix on. Must be the version wry uses
# (see Cargo.lock), since the webview handles Tauri gives us are its types.
webview2-com = "0.39"

[profile.release]
strip = true
lto = true
codegen-units = 1
