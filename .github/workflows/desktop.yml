name: Desktop (Windows .exe)

# Builds the optional Tauri desktop app. Runs when the desktop wrapper changes, by hand from the
# Actions tab, and for v* tags (which also attach the installer to the release).
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src-tauri/**', '.github/workflows/desktop.yml', 'package-lock.json']
  pull_request:
    paths: ['src-tauri/**', '.github/workflows/desktop.yml', 'package-lock.json']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v6
        with:
          name: jeopardy-builder-windows
          path: |
            src-tauri/target/release/jeopardy-builder.exe
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: jeopardy-builder-windows
      - uses: softprops/action-gh-release@v3
        with:
          files: '**/*.exe'
