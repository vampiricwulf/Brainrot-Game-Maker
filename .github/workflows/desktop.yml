name: Desktop (Windows .exe)

# Checks the Tauri desktop wrapper on pull requests that touch it (and by hand from the Actions tab).
# Pushes to main build the .exe as part of the Build workflow, which also publishes the release.
on:
  workflow_dispatch:
  pull_request:
    paths: ['src-tauri/**', '.github/workflows/desktop.yml', 'package-lock.json']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v6
        with:
          name: jeopardy-builder-windows
          path: |
            src-tauri/target/release/jeopardy-builder.exe
            src-tauri/target/release/bundle/nsis/*.exe
