<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      What a private card may load (partner-clues spec §14.6): pictures, videos and sounds from https links and from the
      card files this page fetches (blob:), and only the YouTube (no-cookie), Google Drive and Streamable players in a
      frame (cards.ts FRAME_ORIGINS). data: is for the icon below. No default-src or script-src: the page's own script
      and style are inline (build.mjs). It's served as a static file, not by the Worker, so the policy is set here.
    -->
    <meta http-equiv="Content-Security-Policy" content="img-src https: blob: data: 'self'; media-src https: blob: 'self'; frame-src https://www.youtube-nocookie.com https://drive.google.com https://streamable.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12131a" />
    <meta name="color-scheme" content="dark" />
    <title>Brainrot Buzzer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%233d68ea'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23fff'/%3E%3C/svg%3E" />
    <style>/*STYLE*/</style>
  </head>
  <body>
    <header>
      <span id="title">Brainrot Buzzer</span>
      <span class="right">
        <button id="sound" type="button" class="icon" hidden></button>
        <span class="sr">Room code</span>
        <span id="code"></span>
      </span>
    </header>
    <main>
      <section id="s-code" hidden>
        <h1>Join a game</h1>
        <form id="code-form">
          <label for="code-in">Room code</label>
          <input id="code-in" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="4" placeholder="BKTZ" />
          <button type="submit" class="primary">Join</button>
          <p id="code-err" class="err" role="alert"></p>
        </form>
      </section>

      <section id="s-wait" hidden>
        <h1 class="sr">Joining the game</h1>
        <p class="big-msg" id="wait-text">Connecting…</p>
        <button type="button" id="wait-cancel" class="plain" hidden>Cancel</button>
      </section>

      <section id="s-seats" hidden>
        <h1 id="seats-title">Tap your name</h1>
        <p id="seats-status" class="note"></p>
        <p id="seats-note" class="note"></p>
        <div id="seat-list"></div>
        <button id="new-btn" class="seat new" hidden>＋ I'm new</button>
        <p id="host-away" class="note" hidden>The host isn't connected right now.</p>
      </section>

      <section id="s-new" hidden>
        <h1>What's your name?</h1>
        <form id="new-form">
          <label for="new-in">Your name (everyone sees it)</label>
          <input id="new-in" maxlength="24" autocomplete="nickname" placeholder="e.g. Zoe" />
          <button type="submit" class="primary">Ask to join</button>
          <button type="button" id="new-back" class="plain">Back</button>
          <p id="new-err" class="err" role="alert"></p>
        </form>
      </section>

      <section id="s-team" hidden>
        <h1><span id="team-dot" aria-hidden="true"></span><span id="team-title"></span></h1>
        <p id="team-on" class="note" dir="auto"></p>
        <form id="team-form">
          <label for="team-in">Your name (everyone sees it)</label>
          <input id="team-in" maxlength="24" autocomplete="nickname" placeholder="e.g. Zoe" />
          <button type="submit" class="primary">Join the team</button>
          <button type="button" id="team-back" class="plain">Back</button>
          <p id="team-err" class="note" role="alert"></p>
        </form>
      </section>

      <section id="s-msg" hidden>
        <h1 id="msg-title" tabindex="-1"></h1>
        <p id="msg-text"></p>
        <button id="msg-btn" class="primary" hidden></button>
      </section>

      <section id="s-buzz" hidden>
        <h1 class="sr">Your buzzer</h1>
        <div class="side">
          <!-- What's on ("Science · $800"), above the question: it never scrolls away with it. -->
          <p id="clue-cap" dir="auto" hidden></p>
          <!-- The question only, fitted to the room left (main.ts fitClue); past that it scrolls, ▼ More over it. -->
          <p id="clue" dir="auto"></p>
          <button id="clue-more" type="button" class="more-pill" aria-controls="clue" aria-label="Show more of the question" hidden>▼ More</button>
          <!-- The status line, when cards take the buzzer's place: over them on a phone, beside them on its side. -->
          <p id="card-status" hidden><span id="card-status-big" dir="auto"></span><span id="card-status-small" dir="auto"></span></p>
          <p id="host-note" class="warn-note" hidden>The host’s connection dropped: waiting for them…</p>
        </div>
        <!--
          Private cards the host sent to this phone, newest first: in the buzzer's place, or above a wager or answer
          box. Cards sent before this phone joined are only counted (cards-late).
        -->
        <div id="cards" hidden>
          <div id="card-list"></div>
          <p id="cards-late" class="note" hidden></p>
        </div>
        <!-- Wagers: this player's own box (the amount goes to the host only). -->
        <form id="wager-form" novalidate hidden>
          <!-- (What it's for is over it already: "Daily Double — you're up!", or the Final's name.) Score and max over the box. -->
          <!-- The host's countdown, while it runs ("⏱ 12 s left"; main.ts drawClock). -->
          <p id="wager-clock" class="clock" hidden></p>
          <label for="wager-in" id="wager-label">Your wager (only the host sees it)</label>
          <p id="wager-info" class="note"></p>
          <input id="wager-in" type="number" inputmode="numeric" min="0" step="1" autocomplete="off" enterkeyhint="send" aria-describedby="wager-info" />
          <p id="wager-err" class="err" role="alert"></p>
          <button type="submit" class="primary" id="wager-send">Send wager</button>
          <p id="wager-state" class="note"></p>
        </form>
        <!-- A ✍ clue: everyone types an answer (only the host sees it). -->
        <form id="answer-form" novalidate hidden>
          <!-- A partner clue's guesser: whose turn it is ("🎯 You're guessing!"), and who's describing. -->
          <h2 id="answer-head" dir="auto" hidden></h2>
          <p id="answer-sub" class="note" dir="auto" hidden></p>
          <!-- The host's countdown, while it runs ("⏱ 12 s left"; main.ts drawClock). -->
          <p id="answer-clock" class="clock" hidden></p>
          <label for="answer-in" id="answer-label">Your answer (only the host sees it until the answer is up)</label>
          <!--
            A ✍ clue's multiple choices: one button each, in place of the box to type in (main.ts drawChoices). Named by
            the label above while they're up (renderAnswer).
          -->
          <div id="answer-choices" role="group" hidden></div>
          <!-- (Lines: a phone keyboard's Enter key starts one, Send answer sends; with a keyboard Enter sends: main.ts drawDesk.) -->
          <textarea id="answer-in" rows="2" maxlength="200" autocomplete="off" enterkeyhint="enter" dir="auto"></textarea>
          <button type="submit" class="primary" id="answer-send">Send answer</button>
          <!-- Desktop only (the hints with the "desk" class): the keys. -->
          <p id="answer-keys" class="note desk">Enter sends · Shift+Enter for a new line</p>
          <p id="answer-state" class="note"></p>
          <p id="answer-err" class="err" role="alert"></p>
        </form>
        <button id="buzz" type="button"><span id="buzz-big"></span><span id="buzz-small"></span></button>
        <!-- An ordinary buzz-in clue: pass on it ("I won't buzz on this one"), or take the pass back (main.ts renderPass). -->
        <button id="pass" type="button" hidden></button>
        <div class="side foot">
          <p id="keys" class="note desk"></p>
          <p id="me" dir="auto"></p>
          <button id="color-btn" type="button" class="link" aria-expanded="false" aria-controls="colors" hidden>🎨 Change your color</button>
          <div id="colors" role="group" aria-label="Pick your color" hidden></div>
          <!-- A tap on a color another player has: why nothing happened (main.ts). -->
          <p id="colors-note" class="note" role="status"></p>
          <button id="leave" type="button" class="link" aria-expanded="false" aria-controls="leave-ask">Not you? Change player</button>
          <!-- What it asks first, on the page (an app's own browser may never show the browser's box): main.ts askLeave. -->
          <div id="leave-ask" role="group" aria-labelledby="leave-q" hidden>
            <p id="leave-q" dir="auto"></p>
            <div class="any-btns">
              <button id="leave-no" type="button" class="plain">Keep playing</button>
              <button id="leave-yes" type="button" class="primary"></button>
            </div>
          </div>
        </div>
        <!--
          ＋ Pick any color (main.ts, openAny): the square and the hue strip (dragged, or the arrow keys) and a Hex box.
          The buzzer shows the color as it moves; OK, or a tap off it (on #any-back), sends it; Cancel or Esc doesn't.
        -->
        <div id="any-back" hidden></div>
        <div id="any" role="dialog" aria-modal="true" aria-labelledby="any-title" hidden>
          <div class="any-head">
            <h2 id="any-title">Pick any color</h2>
            <span id="any-now" role="img"></span>
          </div>
          <div id="any-sq" class="any-slide" role="slider" tabindex="0" aria-label="Color and brightness" aria-valuemin="0" aria-valuemax="100"><span class="any-dot"></span></div>
          <div id="any-hue" class="any-slide" role="slider" tabindex="0" aria-label="Hue" aria-valuemin="0" aria-valuemax="360"><span class="any-knob"></span></div>
          <label class="any-hex"><span>Hex</span><input id="any-hex" type="text" maxlength="12" spellcheck="false" autocomplete="off" autocapitalize="off" enterkeyhint="done" /></label>
          <p id="any-note" aria-live="polite"></p>
          <div class="any-btns">
            <button id="any-cancel" type="button" class="plain">Cancel</button>
            <button id="any-ok" type="button" class="primary">OK</button>
          </div>
        </div>
      </section>
    </main>
    <div id="overlay" hidden><p id="overlay-text" tabindex="-1">Reconnecting…</p><button id="overlay-retry" type="button" class="primary" hidden>Try again now</button></div>
    <div id="flash" aria-hidden="true"></div>
    <p id="live" class="sr" role="status" aria-live="polite"></p>
    <!-- Said once and emptied (a card arriving, its picture arriving while it's open): the screen's words above stay. -->
    <p id="news" class="sr" aria-live="polite"></p>
    <p id="alert" class="sr" aria-live="assertive"></p>
    <script>/*SCRIPT*/</script>
  </body>
</html>
